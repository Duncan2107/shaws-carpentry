# Cloudflare Workers config for the Shaws Carpentry site.
#
# Phase 1 serves the static site only. Later phases add the D1 database,
# R2 photo storage and the admin API, which is why this is a Worker with
# static assets rather than a plain Pages project.

name = "shaws-carpentry"
main = "src/index.js"
compatibility_date = "2026-07-28"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker must run before the asset server for the HTML pages, so it can
# inject content from D1. Everything else (CSS, JS, images) is served straight
# from the asset server, which is faster and not billed as a request.
run_worker_first = [
  "/",
  "/index.html",
  "/services",
  "/services.html",
  "/gallery",
  "/gallery.html",
  "/contact",
  "/contact.html",
  # The admin area and its API must never be served straight from the asset
  # server, or the sign-in check would be skipped.
  "/admin",
  "/admin/*",
  "/api/*",
]

[observability]
enabled = true

# Gives the Worker its own deployment id, which is used to version the CSS and
# JS URLs so a browser can never run yesterday's code against today's markup.
[version_metadata]
binding = "CF_VERSION"

[[d1_databases]]
binding = "DB"
database_name = "shaws-carpentry"
database_id = "2b8fb15a-d286-45ac-8c0f-8416e7e88155"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "shaws-carpentry-photos"
